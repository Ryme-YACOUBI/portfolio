<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Digital Resume</title> 
        <link rel="stylesheet" href="contact.css">
    </head>
    <body>
        <header>
            <h1>Get in touch</h1>
            <h2>Have a question or an opportunity? Feel free to reach out.</h2>
        </header>
        <main>
            <form id="contact-form">
                <fieldset>
                    <div>
                        <label for="fn">Full name *</label>
                        <input type="text" id="fn" placeholder="Enter your name" name="name" required>
                    </div>
                    <div>
                        <label for="ea">Email address *</label>
                        <input type="email" id="ea" placeholder="you@example.com" name="email" required>
                    </div>
                     <div>
                        <label for="sub">Subject *</label>
                        <input type="text" id="sub" placeholder="Internship opportunity, job offer..." name="subject" required>
                    </div>
                    <div>
                        <label for="mes">Message *</label>
                        <textarea id="mes" placeholder="Write your message here..." name="message" required></textarea>
                    </div>
                    <div>
                        <button type="submit">Send message</button>
                    </div>

                </fieldset>
            </form>
        </main>


    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="contact.js"></script>
                    
    </body>
</html>
